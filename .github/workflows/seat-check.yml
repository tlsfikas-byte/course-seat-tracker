name: Seat Tracker

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:         # lets you also trigger it manually from GitHub's UI

jobs:
  check-seats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run seat check
        env:
          COOKIE_HEADER: ${{ secrets.COOKIE_HEADER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_seats.py

      - name: Commit updated state file
        run: |
          git config user.name "seat-tracker-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update seat status"
          git push
